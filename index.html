<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moovie — Download</title>
<meta name="description" content="Download Moovie, the free Android movie & TV app with offline mode.">
<meta property="og:title" content="Moovie — Download">
<meta property="og:description" content="Free Android movie app: discovery, watchlist, offline downloads, AI recs and watch parties. Direct APK download.">
<meta property="og:type" content="website">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0D0E12;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Logo watermark background — fixed, centered, faded, gently breathing */
  .logo-bg {
    position: fixed;
    inset: 0;
    background: url("logo.jpg") center 42% / min(72vmin, 560px) no-repeat;
    opacity: 0.10;
    filter: saturate(1.1);
    pointer-events: none;
    user-select: none;
  }

  /* Soft vignette so text stays readable over the watermark */
  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(13, 14, 18, 0.55) 75%, rgba(13, 14, 18, 0.9) 100%);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 34rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
  }

  .logo {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    object-fit: cover;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .tagline {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    color: rgba(255, 255, 255, 0.65);
    line-height: 1.5;
    max-width: 28rem;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.65rem;
    margin-top: 0.6rem;
    padding: 1rem 2.2rem;
    background: #F5C518;
    color: #14130D;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 999px;
    border: none;
    box-shadow: 0 8px 30px rgba(245, 197, 25, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .download-btn:hover {
    background: #ffd633;
    transform: translateY(-2px);
    box-shadow: 0 12px 38px rgba(245, 197, 25, 0.5);
  }

  .download-btn:active { transform: translateY(0); }

  .download-btn svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

  .meta {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.45);
    min-height: 1.3em;
  }

  .alt-link {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.4);
    text-decoration: none;
    border-bottom: 1px dotted rgba(255, 255, 255, 0.3);
  }

  .alt-link:hover { color: rgba(255, 255, 255, 0.7); }

  .requirements {
    margin-top: 0.8rem;
    font-size: 0.78rem;
    color: rgba(255, 255, 255, 0.35);
  }

  @media (prefers-reduced-motion: no-preference) {
    .logo-bg { animation: breathe 9s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.10; transform: scale(1); }
      50%      { opacity: 0.16; transform: scale(1.025); }
    }
  }
</style>
</head>
<body>
  <div class="logo-bg" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="content">
    <img class="logo" src="logo.jpg" alt="Moovie logo" width="96" height="96">

    <h1>Moovie</h1>

    <p class="tagline">
      Every movie, one place. Trending picks, a synced watchlist, offline
      downloads, AI recommendations and watch parties — free and open.
    </p>

    <a class="download-btn" id="dl-btn"
       href="https://github.com/Pro-mwas1234/Moovie/releases/latest"
       target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v10.586l-3.293-3.293-1.414 1.414L12 16.414l4.707-4.707-1.414-1.414L12 13.586V3h-1.5zM5 19h14v2H5v-2z" transform="translate(0,-1.5)"/>
      </svg>
      <span id="btnLabel">Download for Android</span>
    </a>

    <p class="meta" id="meta"></p>

    <a class="alt-link" href="https://github.com/Pro-mwas1234/Moovie/releases" target="_blank" rel="noopener">
      All releases
    </a>

    <p class="requirements">Requires Android 9 (Pie) or newer · arm64 / arm32</p>
  </main>

<script>
(function () {
  // Default state: the button is a plain, working link to the releases page.
  // This means the download ALWAYS works, even if JS or the API fails.
  // When the GitHub API responds successfully, we upgrade the button to a
  // direct download link pointing at the real APK asset — no filename guessing.
  var API = "https://api.github.com/repos/Pro-mwas1234/Moovie/releases/latest";
  var btn = document.getElementById("dl-btn");
  var label = document.getElementById("btnLabel");
  var meta = document.getElementById("meta");

  fetch(API, { headers: { Accept: "application/vnd.github+json" } })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (release) {
      if (!release) return;

      var apk = (release.assets || []).find(function (a) {
        return /\.apk$/i.test(a.name || "");
      });
      if (!apk) return;

      // Point the button at the REAL APK asset and let it download directly
      btn.href = apk.browser_download_url;
      btn.removeAttribute("target"); // let Android treat it as a direct download

      var tag = release.tag_name || "latest";
      label.textContent =
        "Download v" + tag + " · " + (apk.size / 1048576).toFixed(1) + " MB";
      meta.textContent = "Latest release: " + tag;
    })
    .catch(function () {
      // Silent — the plain link to the releases page already works as a fallback.
    });
})();
</script>
</body>
</html>
