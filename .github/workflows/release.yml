name: Release

# Builds a release APK and publishes it to a GitHub Release whenever a tag
# like v1.2.3 is pushed. The in-app updater reads that same release feed, so
# shipping an update is: bump versionCode/versionName, commit, tag, push.
#
# APK signing: add repo secrets MOOVIE_KEYSTORE_B64 / MOOVIE_STORE_PASSWORD /
# MOOVIE_KEY_ALIAS / MOOVIE_KEY_PASSWORD to sign with your own key. Without
# them it falls back to the debug key (still installable, just not
# upgrade-compatible with a properly signed build).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (platform-tools, build-tools, platforms, accepted licenses), and AGP
      # auto-installs anything missing. android-actions/setup-android is
      # deliberately NOT used: its v3 force-runs `sdkmanager tools`, a package
      # that no longer exists in the SDK repo, which fails every run.

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure gradlew executable
        run: chmod +x gradlew

      - name: Write local.properties from secrets
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # TMDB key is required: an APK built without it ships with an empty
          # key and every movie list fails with "Couldn't load movies".
          if [ -z "$TMDB_KEY" ]; then
            echo "::error::Secret TMDB_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf 'sdk.dir=%s\ntmdb.api.key=%s\n' "$ANDROID_HOME" "$TMDB_KEY" > local.properties

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          # Optional but recommended: without it the app builds in local-only
          # mode (no cloud sign-in, no watch parties). Base64-encode your
          # Firebase config file and store it as the GOOGLE_SERVICES_JSON_B64
          # secret:   base64 -w0 google-services.json
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json
            echo "google-services.json written from secret"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_B64 not set - building in local-only mode (no Firebase)."
          fi

      - name: Prepare signing variables (always exported)
        env:
          MOOVIE_KEYSTORE_B64: ${{ secrets.MOOVIE_KEYSTORE_B64 }}
          MOOVIE_STORE_PASSWORD: ${{ secrets.MOOVIE_STORE_PASSWORD }}
          MOOVIE_KEY_ALIAS: ${{ secrets.MOOVIE_KEY_ALIAS }}
          MOOVIE_KEY_PASSWORD: ${{ secrets.MOOVIE_KEY_PASSWORD }}
        run: |
          # If a keystore secret is provided, decode it and export the file path.
          # (Gradle treats a blank MOOVIE_STORE_FILE as "no CI signing".)
          if [[ -n "$MOOVIE_KEYSTORE_B64" ]]; then
            echo "$MOOVIE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/moovie.keystore"
            echo "MOOVIE_STORE_FILE=$RUNNER_TEMP/moovie.keystore" >> "$GITHUB_ENV"
            echo "MOOVIE_STORE_PASSWORD=$MOOVIE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MOOVIE_KEY_ALIAS=$MOOVIE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MOOVIE_KEY_PASSWORD=$MOOVIE_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/*/app-*.apk | head -1)
          NAME="Moovie-${{ inputs.tag || github.ref_name }}.apk"
          cp "$SRC" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: Moovie-*.apk
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
